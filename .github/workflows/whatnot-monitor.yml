name: Whatnot live monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:         # adds a "Run workflow" button for manual runs
    inputs:
      test_message:
        description: "Just send a test message to Discord"
        type: boolean
        default: false

permissions:
  contents: write            # lets the job save state.json back to the repo

concurrency:
  group: whatnot-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Whatnot
        run: python monitor.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WHATNOT_USERS: ${{ vars.WHATNOT_USERS }}
          TEST_MESSAGE: ${{ inputs.test_message }}

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update live state"
            git push
          fi
