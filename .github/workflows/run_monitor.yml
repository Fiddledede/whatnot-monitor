name: Whatnot Live Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Choose action'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - test_notification

jobs:
  check-live:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the script to save live_status.txt back to GitHub
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests

    - name: Run Test Notification
      if: ${{ github.event.inputs.action_type == 'test_notification' }}
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python monitor.py test

    - name: Run Normal Live Check
      if: ${{ github.event.inputs.action_type != 'test_notification' }}
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python monitor.py
        
        # Save the status file back to the repository so it remembers next time
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add live_status.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update live status" && git push)
