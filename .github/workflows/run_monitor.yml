name: Whatnot Live Monitor

on:
  schedule:
    # Triggers the script every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to manually trigger it via GitHub to test it

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Fixed the typo from python-node-version

    - name: Install Dependencies
      run: pip install requests

    - name: Run Scraper
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python monitor.py
